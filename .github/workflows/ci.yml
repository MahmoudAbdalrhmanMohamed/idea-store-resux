name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resux check
        run: npm run check

      - name: Build Vercel output
        run: npm run build
        env:
          VERCEL: "1"
          VERCEL_ENV: preview
          RESUX_HALAL_REPORT_SIGNING_SECRET: "idea-store-ci-report-signing-secret-not-for-production-use"

      - name: Verify Vercel build output
        shell: bash
        run: |
          test -f .vercel/output/config.json
          test -f .vercel/output/static/__resux/runtime-client.mjs
          test -d .vercel/output/functions
