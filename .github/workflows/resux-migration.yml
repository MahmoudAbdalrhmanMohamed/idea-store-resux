name: Resux migration validation

on:
  push:
    branches:
      - chore/resux-beta2-vercel

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for Resux beta.2"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Create CI signing secret
        shell: bash
        run: echo "RESUX_HALAL_REPORT_SIGNING_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Check Resux application
        run: npm run check

      - name: Build Resux application for Vercel
        run: npm run build
