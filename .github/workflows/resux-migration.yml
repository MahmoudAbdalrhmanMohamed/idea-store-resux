name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create CI signing secret
        shell: bash
        run: echo "RESUX_HALAL_REPORT_SIGNING_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Check Resux application
        run: npm run check

      - name: Build Resux application for Vercel
        run: npm run build
